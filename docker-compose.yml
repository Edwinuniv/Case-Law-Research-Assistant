# Local PostgreSQL with pgvector.  Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: verdicta
      POSTGRES_PASSWORD: verdicta
      POSTGRES_DB: verdicta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
