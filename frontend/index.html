<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verdicta</title>
    <link rel="icon" type="image/png" href="./src/assets/favicon.png" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/splash.css" />
    <!-- the appearance chosen in Settings (components/ThemeSwitch.jsx), set before the page is drawn: no flash -->
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("verdicta-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  </head>
  <body>
    <!-- the loading screen (Edwin): shown at once, removed by main.jsx when the page is ready -->
    <div id="splash" role="status" aria-label="Loading Verdicta">
      <div class="sl-wrap">
        <div class="sl-stage" aria-hidden="true">
          <i class="sl-halo"></i>
          <img class="sl-v" src="./src/assets/splash/v.webp" alt="" />
          <img class="sl-vgold" src="./src/assets/splash/v-gold.webp" alt="" />
          <img class="sl-scales" src="./src/assets/splash/scales.webp" alt="" />
          <img class="sl-net" src="./src/assets/splash/network.webp" alt="" />
          <i class="sl-shine"></i>
        </div>
        <p class="sl-name" aria-hidden="true"><span>V</span><span>E</span><span>R</span><span>D</span><span>I</span><span>C</span><span>T</span><span>A</span></p>
        <p class="sl-tag">Verified case-law research</p>
        <div class="sl-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <!-- outside React: shown on every page, even before the JavaScript has loaded (SR7) -->
    <footer>
      <nav aria-label="Site information"><a href="/privacy">Privacy</a> · <a href="/terms">Terms of use</a> ·
        <a href="/sources">Sources &amp; licences</a> · <a href="/contact">Contact</a></nav>
      This is a research aid, not legal advice. · Data: CourtListener (Free Law Project), public domain.
    </footer>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
